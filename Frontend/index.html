<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueUp - Campus Queue Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="app" class="min-h-screen">
        <header class="bg-white shadow-lg sticky top-0 z-50">
            <nav class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-xl">Q</span>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">QueueUp</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-sm text-gray-600">
                        <span id="userIdDisplay" class="font-mono bg-gray-100 px-3 py-1 rounded">Loading...</span>
                    </div>
                    <div id="connectionStatus" class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                        <span class="text-xs text-gray-600">Connecting...</span>
                    </div>
                </div>
            </nav>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid md:grid-cols-2 gap-8">
                <section>
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Available Services</h2>
                    <div id="servicesList" class="space-y-3">
                        <div class="animate-pulse bg-white rounded-lg p-4 h-32"></div>
                    </div>
                </section>

                <section>
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">My Queue</h2>
                    <div id="myQueue" class="bg-white rounded-lg shadow-lg p-6">
                        <p class="text-gray-500 text-center py-8">No active queue</p>
                    </div>
                </section>
            </div>

            <section class="mt-12">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Queue Statistics</h2>
                <div id="statsGrid" class="grid md:grid-cols-2 gap-4">
                    <div class="animate-pulse bg-white rounded-lg p-4 h-24"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
